# runs r cmd check + unit tests in inst/tinytest
name: r-cmd-check

on:
  pull_request:
    branches: [main, dev]
    # types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# gh-pages deploy step (pkgdown::deploy_to_branch) needs write access.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - uses: r-lib/actions/setup-tinytex@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::remotes
            any::covr
            any::pkgdown
          needs: check

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          upload-snapshots: true
          # args: 'c("--ignore-vignettes")'
          # build_args: 'c("--no-build-vignettes")'

      - name: Install package
        if: success() && (contains('refs/heads/main', github.ref) || contains('refs/heads/deploy', github.ref))
        run: make install

      - name: Webpage deployment
        if: >-
          success() && github.ref == 'refs/heads/main'
          && matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'

      - name: Code Coverage
        if: >-
          success() && github.ref == 'refs/heads/main'
          && matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: covr::codecov(type=c("tests", "examples"))
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
